name: astrbot_plugin_meme_generator
display_name: 表情包生成插件
desc: "AstrBot 表情包生成插件，支持关键词触发、模板查询、冷却控制与禁用管理，并内置 GIF 动图工具箱"
help: |
  关键词触发表情生成。命令：表情帮助、表情列表、表情信息 [关键词]、单表情禁用 [模板名]、单表情启用 [模板名]、禁用列表

  GIF 工具箱（发送或引用图片后直接发指令，不需要前缀）：变速2x / 30fps、加速5、减速3、倒放、分解、裁剪3x4、线稿、做旧10、表情合成、视频转gif 1s-5s。结果只回图片。
version: v2.4.0
author: SodaSizzle
repo: https://github.com/SodaSizzle/astrbot_plugin_meme_generator
